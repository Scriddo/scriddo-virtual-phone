
name: Scriddo Android 16 Boot Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clear Android SDK download cache
        run: |
          rm -rf "$HOME/.android/cache"
          rm -rf "$HOME/.android/avd"
          mkdir -p "$HOME/.android"

      - name: Boot Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            echo "Android version:"
            adb shell getprop ro.build.version.release
            echo "Android SDK level:"
            adb shell getprop ro.build.version.sdk
            echo "Android emulator booted successfully!"
            
