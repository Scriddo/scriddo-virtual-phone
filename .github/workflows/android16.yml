
name: Scriddo Android 16 Remote Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install desktop and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb fluxbox x11vnc curl \
            libnss3 libx11-6 libx11-xcb1 libxcb1 \
            libxcomposite1 libxcursor1 libxi6 libxrandr2 \
            libxrender1 libxtst6 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libpulse0 libasound2t64 \
            libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
            libdrm2 libgbm1 libxfixes3 libxdamage1 \
            libxkbcommon0 libwayland-client0

          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          git clone --depth 1 https://github.com/novnc/websockify.git /tmp/noVNC/utils/websockify

      - name: Configure VNC password
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "Missing repository secret VNC_PASSWORD"
            exit 1
          fi

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass
          chmod 600 /tmp/vnc.pass

      - name: Install Cloudflare tunnel
        run: |
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Boot Android 16 and start remote desktop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -eu

            echo "Android version:"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            echo "Starting virtual display..."
            Xvfb :99 -screen 0 1280x900x24 -ac >/tmp/xvfb.log 2>&1 &
            sleep 3

            export DISPLAY=:99
            fluxbox >/tmp/fluxbox.log 2>&1 &
            sleep 2

            echo "Starting VNC server..."
            x11vnc -display :99 -localhost \
              -rfbauth /tmp/vnc.pass -forever -shared -bg

            echo "Starting noVNC..."
            /tmp/noVNC/utils/novnc_proxy \
              --listen 127.0.0.1:6080 \
              --vnc 127.0.0.1:5900 \
              >/tmp/novnc.log 2>&1 &

            echo "Starting temporary tunnel..."
            /tmp/cloudflared tunnel \
              --no-autoupdate \
              --url http://127.0.0.1:6080 \
              >/tmp/tunnel.log 2>&1 &

            URL=""
            i=0

            while [ "$i" -lt 30 ]; do
              URL=$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)

              if [ -n "$URL" ]; then
                break
              fi

              i=$((i + 1))
              sleep 2
            done

            if [ -z "$URL" ]; then
              echo "Tunnel URL was not created."
              cat /tmp/tunnel.log
              exit 1
            fi

            echo "Temporary browser URL: ${URL}/vnc.html"
            echo "Session running for 25 minutes."
            sleep 1500
            
